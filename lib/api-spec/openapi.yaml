        "200":
          description: Presigned URL and object path
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL:
                    type: string
                  objectPath:
                    type: string
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      contentType:
                        type: string

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - in: path
          name: objectPath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object bytes

