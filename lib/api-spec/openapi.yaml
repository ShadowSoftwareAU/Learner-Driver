      operationId: getModerationCases
      tags: [moderation]
      summary: List moderation cases (super_admin only)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: severity
          in: query
          schema:
            type: string
        - name: schoolId
          in: query
          schema:
            type: integer
        - name: contentType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Cases list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationCase"

  /moderation/cases/{id}:
    get:
      operationId: getModerationCase
      tags: [moderation]
      summary: Get a moderation case with its event history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCaseDetail"
    patch:
      operationId: updateModerationCase
      tags: [moderation]
      summary: Update case status, legalHold, or reviewOutcome
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationCasePatch"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"

  /moderation/cases/{id}/release:
    post:
      operationId: releaseModerationCase
      tags: [moderation]
      summary: Release quarantined content after review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
      responses:
        "200":
          description: Case released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /moderation/cases/{id}/escalate:
    post:
      operationId: escalateModerationCase
      tags: [moderation]
      summary: Escalate a moderation case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Case escalated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /moderation/exports:
    post:
      operationId: createModerationExport
      tags: [moderation]
      summary: Create a law enforcement evidence export (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationExportInput"
      responses:
        "201":
          description: Export created
          content:
            application/json:
              schema:
                type: object
                required: [exportId, caseCount]
                properties:
                  exportId:
                    type: integer
                  caseCount:
                    type: integer

  # ─── Billing ──────────────────────────────────────────────────────────────────
  /billing/subscription:
    get:
      operationId: getMySubscription
      tags: [billing]
      summary: Get current subscription and pricing info
      responses:
        "200":
          description: Subscription info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionInfo"
    post:
      operationId: createOrUpdateSubscription
      tags: [billing]
      summary: Create or update a subscription (stub)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode:
                  type: string
                schoolId:
                  type: integer
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /billing/entitlements:
    get:
      operationId: getMyEntitlements
      tags: [billing]
      summary: Get merged feature entitlements for the current user/school
      responses:
        "200":
          description: Entitlements list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntitlementSummary"

  /billing/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Stripe webhook endpoint (stub)
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ─── Wallet ───────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getMyWallet
      tags: [wallet]
      summary: Get the current viewer's credit balance and recent transactions
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"

  /wallet/checkout:
    post:
      operationId: createWalletCheckout
      tags: [wallet]
      summary: Create a Stripe Checkout session to top up wallet credits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packCents]
              properties:
                packCents:
                  type: integer
      responses:
        "200":
          description: Checkout session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkoutUrl:
                    type: string

  /wallet/pay-booking/{bookingId}:
    post:
      operationId: payBookingWithCredits
      tags: [wallet]
      summary: Pay for a booking using wallet credits
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking paid
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  balanceCents:
                    type: integer

  # ─── Demo ─────────────────────────────────────────────────────────────────────
  /demo/status:
    get:
      operationId: getDemoStatus
      tags: [demo]
      summary: Get demo mode status (super_admin only)
      responses:
        "200":
          description: Demo status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoStatus"

  /demo/reset:
    post:
      operationId: resetDemoData
      tags: [demo]
      summary: Reset demo school data (super_admin only, feature-flagged)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoResetInput"
      responses:
        "200":
          description: Demo data reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoResetResult"

  # ─── Toilets ──────────────────────────────────────────────────────────────

  /toilets/submit:
    post:
      operationId: submitToilet
      tags: [toilets]
      summary: Submit a new community-reported toilet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToiletSubmitInput"
      responses:
        "201":
          description: Newly created toilet record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovToilet"

  /toilets/gov-nearby:
    get:
      operationId: getGovNearby
      tags: [toilets]
      summary: Get government-sourced public toilets within a bounding box
      security:
        - bearerAuth: []
      parameters:
        - name: s
          in: query
          required: true
          schema: { type: number }
        - name: w
          in: query
          required: true
          schema: { type: number }
        - name: n
          in: query
          required: true
          schema: { type: number }
        - name: e
          in: query
          required: true
          schema: { type: number }
      responses:
        "200":
          description: List of government-sourced toilet records in the bounding box
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GovToilet"

  /toilets/{osmId}/summary:
    get:
      operationId: getToiletSummary
      tags: [toilets]
      summary: Get community cleanliness summary for a public toilet
      parameters:
        - name: osmId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Toilet community summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToiletSummary"

  /toilets/{osmId}/rate:
    post:
      operationId: rateToilet
      tags: [toilets]
      summary: Submit or update a cleanliness rating for a public toilet
      parameters:
        - name: osmId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToiletRateInput"
      responses:
        "200":
          description: Updated community summary after rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToiletSummary"

  # ─── Feedback ────────────────────────────────────────────────────────────────
  /assessments/{id}/feedback:
    post:
      operationId: submitAssessmentFeedback
      tags: [assessments]
      summary: Student submits feedback for a completed assessment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitFeedbackInput"
      responses:
        "201":
          description: Feedback submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFeedbackItem"
        "400": { description: Validation error }
        "403": { description: Access denied }
        "404": { description: Assessment not found }
    get:
      operationId: getAssessmentFeedback
      tags: [assessments]
      summary: Get feedback for an assessment (instructor / admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionFeedbackItem"
        "404": { description: No feedback yet }

  /admin/feedback:
    get:
      operationId: listAdminFeedback
      tags: [assessments]
      summary: List all student feedback visible to this admin
      parameters:
        - name: instructorId
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated feedback list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionFeedbackItem"
                  total:
                    type: integer

  /admin/feedback/summary:
    get:
      operationId: getAdminFeedbackSummary
      tags: [assessments]
      summary: Aggregate feedback stats per instructor
      responses:
        "200":
          description: Per-instructor aggregate stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorFeedbackSummary"

  # ─── Handover audit ──────────────────────────────────────────────────────────
  /admin/handover-notes:
    get:
      operationId: listAdminHandoverNotes
      tags: [handover]
      summary: List all handover notes for admin audit
      parameters:
        - name: instructorId
          in: query
          schema: { type: integer }
        - name: safetyCritical
          in: query
          schema: { type: boolean }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [unreviewed, approved, needs_improvement, flagged] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated handover notes
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HandoverNoteAuditItem"
                  total:
                    type: integer

  /admin/handover-notes/{id}/review:
    post:
      operationId: reviewHandoverNote
      tags: [handover]
      summary: Submit or update an admin review for a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverNoteReviewInput"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNoteReviewRecord"
        "403": { description: Access denied }
        "404": { description: Note not found }
    get:
      operationId: getHandoverNoteReview
      tags: [handover]
      summary: Get the review record for a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Review record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNoteReviewRecord"
        "404": { description: Not reviewed yet }

  # ─── Feedback settings ───────────────────────────────────────────────────────
  /schools/mine/feedback-settings:
    get:
      operationId: getSchoolFeedbackSettings
      tags: [schools]
      summary: Get feedback collection settings for this school
      responses:
        "200":
          description: Feedback settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolFeedbackSettings"
    patch:
      operationId: updateSchoolFeedbackSettings
      tags: [schools]
      summary: Update feedback collection settings (school_admin / owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolFeedbackSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolFeedbackSettings"
        "403": { description: Access denied }

  # ─── Admin sub-role ──────────────────────────────────────────────────────────
  /users/{id}/admin-sub-role:
    patch:
      operationId: setAdminSubRole
      tags: [users]
      summary: Set admin sub-role for a school_admin user (super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminSubRole:
                  type: ["string", "null"]
                  enum: [owner, manager, coordinator, null]
      responses:
        "200":
          description: Updated user
        "403": { description: Access denied }

  # ─── Admin staff management ──────────────────────────────────────────────────
  /admin/permissions/me:
    get:
      operationId: getMyAdminPermissions
      tags: [admin]
      summary: Get the current admin user's permission profile
      responses:
        "200":
          description: Admin permission profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPermissions"
        "403":
          description: Not an admin user

  /admin/staff:
    get:
      operationId: listAdminStaff
      tags: [admin]
      summary: List all admin staff members and pending invites (Owner/Manager only)
      responses:
        "200":
          description: Staff list and pending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffListResponse"
        "403":
          description: Owner or Manager access required

  /admin/staff/invite:
    post:
      operationId: inviteAdminStaff
      tags: [admin]
      summary: Invite a new staff member with specified permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffInviteRequest"
      responses:
        "201":
          description: Invite created
        "403":
          description: Owner or Manager access required

  /admin/staff/invite/{token}:
    get:
      operationId: getAdminStaffInvitePreview
      tags: [admin]
      summary: "Public: preview an admin staff invite token"
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStaffInvitePreview"
        "404":
          description: Not found

  /admin/staff/invite/{token}/claim:
    post:
      operationId: claimAdminStaffInvite
      tags: [admin]
      summary: Claim a staff invite — sets admin role and permissions on the authenticated user
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Claimed
        "404":
          description: Not found
        "409":
          description: Already used or cancelled
        "410":
          description: Expired

  /admin/staff/invite/{id}:
    delete:
      operationId: cancelAdminStaffInvite
      tags: [admin]
      summary: Cancel a pending staff invite
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled

  /admin/staff/{id}/permissions:
    patch:
      operationId: updateAdminStaffPermissions
      tags: [admin]
      summary: Update a staff member's permission flags (Owner/Manager only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPermissionsUpdate"
      responses:
        "200":
          description: Updated
        "403":
          description: Owner or Manager access required

  /admin/staff/{id}/sub-role:
    patch:
      operationId: updateAdminStaffSubRole
      tags: [admin]
      summary: Promote or demote a staff member's sub-role (Owner only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStaffSubRoleUpdate"
      responses:
        "200":
          description: Updated
        "400":
          description: Invalid sub-role or target is an owner
        "403":
          description: Owner access required

  /admin/staff/{id}:
    delete:
      operationId: removeAdminStaff
      tags: [admin]
      summary: Remove a staff member and revoke their admin role (Owner/Manager only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
        "403":
          description: Owner or Manager access required

  # ─── Instructor links (hybrid school/independent model) ─────────────────────
  /instructor-links:
    get:
      operationId: getInstructorLinks
      tags: [schools]
      summary: List all links and pending invites for the authenticated school admin
      responses:
        "200":
          description: Links and pending invites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorLinksResponse"

  /instructor-links/link-by-code:
    post:
      operationId: linkInstructorByCode
      tags: [schools]
      summary: Immediately create an active link using an instructor's 6-character unique link code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [linkCode]
              properties:
                linkCode:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        "201":
          description: Link created
        "409":
          description: Already linked

  /instructor-links/invite:
    post:
      operationId: inviteInstructorByEmail
      tags: [schools]
      summary: Send an invite email and create a pending invite token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                joinBaseUrl:
                  type: string
                  description: "Frontend base URL used to construct the invite link"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreatedResponse"

  /instructor-links/invite/{token}:
    get:
      operationId: getInstructorInvitePreview
      tags: [schools]
      summary: Public preview of an invite token — no auth required
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "404":
          description: Not found

  /instructor-links/invite/{token}/claim:
    post:
      operationId: claimInstructorInvite
      tags: [schools]
      summary: Authenticated user claims an invite token, creating the school-instructor link
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite claimed
        "404":
          description: Not found
        "409":
          description: Already used
        "410":
          description: Expired

  /instructor-links/invite/{id}:
    delete:
      operationId: cancelInstructorInvite
      tags: [schools]
      summary: Cancel a pending invite
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled

  /instructor-links/{id}:
    delete:
      operationId: revokeInstructorLink
      tags: [schools]
      summary: Revoke an active instructor link
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Revoked

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, email]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [student, instructor, admin, school_admin, viewer, super_admin, unassigned]
        adminSubRole:
          type: ["string", "null"]
          enum: [owner, manager, coordinator, null]
        schoolId:
          type: ["integer", "null"]
        createdAt:
          type: string

    UpdateUserProfile:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2

    UpdateOwnStudentProfile:
      type: object
      properties:
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
          description: "Student's street address"

    RoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, instructor, admin, school_admin, viewer, super_admin]

    # ─── Students ──────────────────────────────────────────────────────────────
    Student:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        createdByInstructorId:
          type: ["integer", "null"]
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        guardianName:
          type: ["string", "null"]
        guardianPhone:
          type: ["string", "null"]
        guardianEmail:
          type: ["string", "null"]
        pcycSchoolEmail:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        licenseStatus:
          type: ["string", "null"]
          enum: ["learner", "provisional", "open", "overseas", null]
          description: "Current licence status of the student"
        transmissionPreference:
          type: ["string", "null"]
          enum: ["automatic", "manual", null]
          description: "Student's preferred vehicle transmission type"
        medicalNotes:
          type: ["string", "null"]
          description: "Plain-text instructor-awareness notes (e.g. wears glasses, medication)"
        licenceClass:
          type: ["string", "null"]
          description: "Licence class code (e.g. MR, C, RE)"
        licenceType:
          type: ["string", "null"]
          description: "Licence type/condition code (e.g. O, P1, P2)"
        licenceEffectiveDate:
