openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DriveTrack - Driving School Assessment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and role management
  - name: students
    description: Student management
  - name: instructors
    description: Instructor management
  - name: assessments
    description: Lesson assessments
  - name: maneuvers
    description: Maneuver and competency definitions
  - name: handover
    description: Instructor handover notes
  - name: intake
    description: Student intake questionnaire
  - name: audit
    description: Audit trail
  - name: dashboard
    description: Dashboard summaries
  - name: scheduling
    description: Availability, zones, bookings and notifications

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized

  /users/me/role:
    patch:
      operationId: updateMyRole
      tags: [users]
      summary: Set or update user role (admin only in prod; open for onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── Students ────────────────────────────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students (instructor sees own; admin sees all)
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

    post:
      operationId: createStudent
      tags: [students]
      summary: Create student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found

    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}/progress:
    get:
      operationId: getStudentProgress
      tags: [students]
      summary: Get student skill progress summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /students/{id}/lesson-plan:
    get:
      operationId: getStudentLessonPlan
      tags: [students]
      summary: Generate a dynamic lesson plan based on student skill gaps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson plan with prioritised focus areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonPlan"

  # ─── Instructors ─────────────────────────────────────────────────────────────
  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: List all instructors (admin only)
      responses:
        "200":
          description: List of instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"

  /instructors/{id}:
    get:
      operationId: getInstructor
      tags: [instructors]
      summary: Get instructor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Instructor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

    patch:
      operationId: updateInstructor
      tags: [instructors]
      summary: Update instructor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorUpdate"
      responses:
        "200":
          description: Updated instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

  # ─── Maneuvers / Competencies ─────────────────────────────────────────────────
  /maneuvers:
    get:
      operationId: listManeuvers
      tags: [maneuvers]
      summary: List all maneuver/competency definitions (TMR + QSAFE)
      responses:
        "200":
          description: Maneuver list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Maneuver"

  # ─── Assessments ──────────────────────────────────────────────────────────────
  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments (filtered by studentId or instructorId)
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: instructorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"

    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Log a new lesson assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Created assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get a single assessment with maneuver results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found

    patch:
      operationId: updateAssessment
      tags: [assessments]
      summary: Update assessment notes or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentUpdate"
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}/results:
    post:
      operationId: saveManeuverResults
      tags: [assessments]
      summary: Save maneuver competency ratings for an assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManeuverResultsBatch"
      responses:
        "200":
          description: Saved results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManeuverResult"

  /assessments/heatmap:
    get:
      operationId: getManeuverHeatmap
      tags: [assessments]
      summary: Get maneuver location data for heatmap visualization
      parameters:
        - name: maneuverId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Heatmap data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapPoint"

  # ─── Handover ─────────────────────────────────────────────────────────────────
  /handover/{studentId}:
    get:
      operationId: getHandover
      tags: [handover]
      summary: Get handover view for a student (completed hours, skills, notes)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Handover summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverView"

  /handover/{studentId}/notes:
    post:
      operationId: addHandoverNote
      tags: [handover]
      summary: Add a handover note for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNote"

  # ─── Intake ───────────────────────────────────────────────────────────────────
  /intake/{studentId}:
    get:
      operationId: getIntake
      tags: [intake]
      summary: Get student intake questionnaire responses
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Intake data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intake"
        "404":
          description: Not found

    put:
      operationId: saveIntake
      tags: [intake]
      summary: Submit or update intake questionnaire
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeInput"
      responses:
        "200":
          description: Saved intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intake"

  # ─── Audit Trail ──────────────────────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries (admin only)
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/instructor:
    get:
      operationId: getInstructorDashboard
      tags: [dashboard]
      summary: Instructor dashboard — student counts, recent lessons, upcoming
      responses:
        "200":
          description: Instructor dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorDashboard"

  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Student dashboard — hours, skill completion, recent assessments
      responses:
        "200":
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard — fleet overview, instructor stats, compliance
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  # ─── Availability ─────────────────────────────────────────────────────────────
  /availability/me:
    get:
      operationId: getMyAvailability
      tags: [scheduling]
      summary: Get my availability slots
      responses:
        "200":
          description: List of availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /availability:
    post:
      operationId: createAvailabilitySlot
      tags: [scheduling]
      summary: Create availability slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvailabilitySlot"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySlot"

  /availability/{id}:
    patch:
      operationId: updateAvailabilitySlot
      tags: [scheduling]
      summary: Update availability slot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvailabilitySlot"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySlot"
    delete:
      operationId: deleteAvailabilitySlot
      tags: [scheduling]
      summary: Delete availability slot
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Zones ────────────────────────────────────────────────────────────────────
  /zones/me:
    get:
      operationId: getMyZones
      tags: [scheduling]
      summary: Get my operational zones
      responses:
        "200":
          description: List of zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorZone"

  /zones:
    post:
      operationId: createZone
      tags: [scheduling]
      summary: Add a zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZone"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorZone"

  /zones/{id}:
    delete:
      operationId: deleteZone
      tags: [scheduling]
      summary: Remove a zone
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── Bookings ─────────────────────────────────────────────────────────────────
  /bookings/search:
    get:
      operationId: searchInstructors
      tags: [scheduling]
      summary: Search for available instructors
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
        - in: query
          name: time
          required: true
          schema:
            type: string
        - in: query
          name: transmissionType
          schema:
            type: string
            enum: [auto, manual, either]
        - in: query
          name: suburb
          schema:
            type: string
        - in: query
          name: postcode
          schema:
            type: string
        - in: query
          name: durationMinutes
          schema:
            type: integer
      responses:
        "200":
          description: Available instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableInstructor"

  /bookings:
    get:
      operationId: listBookings
      tags: [scheduling]
      summary: List bookings for current user
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingItem"
    post:
      operationId: createBooking
      tags: [scheduling]
      summary: Create a booking request (broadcasts to instructors)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBooking"
      responses:
        "201":
          description: Booking created and broadcast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingItem"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [scheduling]
      summary: Get booking detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingItem"
    patch:
      operationId: updateBooking
      tags: [scheduling]
      summary: Update booking status or notes
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBookingInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingItem"

  /bookings/{id}/claim:
    post:
      operationId: claimBooking
      tags: [scheduling]
      summary: Instructor claims a booking (first-to-accept)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingItem"
        "409":
          description: Already claimed

  /bookings/{id}/decline:
    post:
      operationId: declineBooking
      tags: [scheduling]
      summary: Instructor declines a broadcast booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined

  # ─── Notifications ────────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [scheduling]
      summary: List my notifications
      parameters:
        - in: query
          name: unread
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      tags: [scheduling]
      summary: Get unread notification count
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer

  /notifications/mark-all-read:
    post:
      operationId: markAllNotificationsRead
      tags: [scheduling]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Done

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [scheduling]
      summary: Mark a notification as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Done

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size, contentType]
              properties:
                name:
                  type: string
                size:
                  type: integer
                contentType:
                  type: string
      responses:
        "200":
          description: Presigned URL and object path
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL:
                    type: string
                  objectPath:
                    type: string
                  metadata:
                    type: object
                    properties:
                      name:
                        type: string
                      size:
                        type: integer
                      contentType:
                        type: string

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve a stored object
      parameters:
        - in: path
          name: objectPath
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object bytes

  /instructor/verification/status:
    get:
      operationId: getVerificationStatus
      tags: [verification]
      summary: Get instructor verification status and documents
      responses:
        "200":
          description: Verification status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatusResponse"

  /instructor/verification/submit:
    post:
      operationId: submitVerification
      tags: [verification]
      summary: Submit or resubmit an instructor verification application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required: [docType, fileName, objectPath]
                    properties:
                      docType:
                        type: string
                      fileName:
                        type: string
                      fileSize:
                        type: integer
                      objectPath:
                        type: string
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationWithDocs"

  /admin/verifications:
    get:
      operationId: listVerifications
      tags: [verification]
      summary: List all instructor verification applications (admin)
      responses:
        "200":
          description: List of verifications with instructor info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVerification"

  /admin/verifications/{id}:
    patch:
      operationId: reviewVerification
      tags: [verification]
      summary: Approve, reject, or request revision on an application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approved, rejected, needs_revision]
                notes:
                  type: string
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorVerification"

  /terms/status:
    get:
      operationId: getTermsStatus
      tags: [terms]
      summary: Get whether the current user has accepted the current terms version
      responses:
        "200":
          description: Terms acceptance status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsStatus"

  /terms/accept:
    post:
      operationId: acceptTerms
      tags: [terms]
      summary: Record acceptance of the current terms version
      responses:
        "201":
          description: Terms accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsStatus"


components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, email]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [student, instructor, admin, unassigned]
        createdAt:
          type: string

    RoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, instructor, admin]

    # ─── Students ──────────────────────────────────────────────────────────────
    Student:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        createdByInstructorId:
