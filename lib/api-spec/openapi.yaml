        - name: instructorId
          in: query
          schema: { type: integer }
        - name: safetyCritical
          in: query
          schema: { type: boolean }
        - name: reviewStatus
          in: query
          schema: { type: string, enum: [unreviewed, approved, needs_improvement, flagged] }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated handover notes
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HandoverNoteAuditItem"
                  total:
                    type: integer

  /admin/handover-notes/{id}/review:
    post:
      operationId: reviewHandoverNote
      tags: [handover]
      summary: Submit or update an admin review for a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverNoteReviewInput"
      responses:
        "200":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNoteReviewRecord"
        "403": { description: Access denied }
        "404": { description: Note not found }
    get:
      operationId: getHandoverNoteReview
      tags: [handover]
      summary: Get the review record for a handover note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Review record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNoteReviewRecord"
        "404": { description: Not reviewed yet }

  # ─── Feedback settings ───────────────────────────────────────────────────────
  /schools/mine/feedback-settings:
    get:
      operationId: getSchoolFeedbackSettings
      tags: [schools]
      summary: Get feedback collection settings for this school
      responses:
        "200":
          description: Feedback settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolFeedbackSettings"
    patch:
      operationId: updateSchoolFeedbackSettings
      tags: [schools]
      summary: Update feedback collection settings (school_admin / owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchoolFeedbackSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchoolFeedbackSettings"
        "403": { description: Access denied }

  # ─── Admin sub-role ──────────────────────────────────────────────────────────
  /users/{id}/admin-sub-role:
    patch:
      operationId: setAdminSubRole
      tags: [users]
      summary: Set admin sub-role for a school_admin user (super_admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                adminSubRole:
                  type: ["string", "null"]
                  enum: [owner, manager, coordinator, null]
      responses:
        "200":
          description: Updated user
        "403": { description: Access denied }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ─── Users ─────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      required: [id, clerkId, role, email]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        role:
          type: string
          enum: [student, instructor, admin, school_admin, viewer, super_admin, unassigned]
        adminSubRole:
          type: ["string", "null"]
          enum: [owner, manager, coordinator, null]
        schoolId:
          type: ["integer", "null"]
        createdAt:
          type: string

    RoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [student, instructor, admin, school_admin, viewer, super_admin]

    # ─── Students ──────────────────────────────────────────────────────────────
    Student:
      type: object
      required: [id, fullName, email]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        createdByInstructorId:
          type: ["integer", "null"]
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        dateOfBirth:
          type: ["string", "null"]
        guardianName:
          type: ["string", "null"]
        guardianPhone:
          type: ["string", "null"]
        guardianEmail:
          type: ["string", "null"]
        pcycSchoolEmail:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        licenceFrontPath:
          type: ["string", "null"]
        licenceBackPath:
          type: ["string", "null"]
        headshotPath:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
          description: "AU state/territory code (QLD, NSW, VIC, SA, WA, TAS, NT, ACT)"
        country:
          type: ["string", "null"]
        totalHours:
          type: number
        status:
          type: string
          enum: [active, on_hold, completed]
        # Medical — only decrypted for instructor/school_admin/super_admin. Null otherwise.
        medicalConditions:
          type: ["string", "null"]
          description: "Decrypted medical conditions — only visible to authorised roles"
        allergies:
          type: ["string", "null"]
          description: "Decrypted allergy info — only visible to authorised roles"
        # Safe preview visible to all authorised viewers (e.g. 'Medical info on file')
        medicalConditionsPreview:
          type: ["string", "null"]
        allergiesPreview:
          type: ["string", "null"]
        # Attendance tracking
        noShowCount:
          type: integer
        attendanceReliabilityScore:
          type: ["integer", "null"]
          description: "0-100; 100 = perfect attendance"
        # Viewer linking
        viewerCode:
          type: ["string", "null"]
          description: "Unique code for parent/guardian linking (DRV-XXXXXXX)"
        viewerCodeIssuedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    StudentInput:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        dateOfBirth:
          type: string
        guardianName:
          type: string
        guardianPhone:
          type: string
        guardianEmail:
          type: string
        pcycSchoolEmail:
          type: string
        licenseNumber:
          type: string
        licenceFrontPath:
          type: string
        licenceBackPath:
          type: string
        headshotPath:
          type: string
        notes:
          type: string
        region:
          type: string
        state:
          type: string
          description: "AU state/territory code (QLD, NSW, VIC, SA, WA, TAS, NT, ACT)"
        country:
          type: string

    StudentUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        guardianName:
          type: string
        guardianPhone:
          type: string
        guardianEmail:
          type: string
        pcycSchoolEmail:
          type: string
        licenseNumber:
          type: string
        licenceFrontPath:
          type: string
        licenceBackPath:
          type: string
        headshotPath:
          type: string
        notes:
          type: string
        region:
          type: string
        state:
          type: string
          description: "AU state/territory code (QLD, NSW, VIC, SA, WA, TAS, NT, ACT)"
        country:
          type: string
        status:
          type: string
          enum: [active, on_hold, completed]
        # Medical — stored encrypted; preview is auto-derived if not supplied
        medicalConditions:
          type: string
          description: "Plain text — server encrypts before storing"
        allergies:
          type: string
          description: "Plain text — server encrypts before storing"
        medicalConditionsPreview:
          type: string
        allergiesPreview:
          type: string

    StudentProgress:
      type: object
      required: [studentId, totalHours, completedManeuvers, totalManeuvers, skillBreakdown]
      properties:
        studentId:
          type: integer
        totalHours:
          type: number
        completedManeuvers:
          type: integer
        totalManeuvers:
          type: integer
        skillBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SkillBreakdownItem"
        recentAssessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"

    SkillBreakdownItem:
      type: object
      required: [category, total, mastered, practicing, notStarted]
      properties:
        category:
          type: string
        total:
          type: integer
        mastered:
          type: integer
        practicing:
          type: integer
        notStarted:
          type: integer

    # ─── Instructors ───────────────────────────────────────────────────────────
    Instructor:
      type: object
      required: [id, userId, fullName, email]
      properties:
        id:
          type: integer
        userId:
          type: integer
        fullName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        licenseNumber:
          type: ["string", "null"]
        vehicleMake:
          type: ["string", "null"]
        vehicleModel:
          type: ["string", "null"]
        vehicleYear:
          type: ["integer", "null"]
        qualifications:
          type: ["string", "null"]
        trainingCategories:
          type: array
          items: { type: string }
        state:
          type: ["string", "null"]
          description: "AU state/territory where this instructor primarily operates"
        isIndependent:
          type: boolean
        activeStudents:
          type: integer
        primaryVehicle:
          oneOf:
            - $ref: "#/components/schemas/InstructorVehicleSummary"
            - type: "null"
        createdAt:
          type: string

    InstructorDetail:
      allOf:
        - $ref: "#/components/schemas/Instructor"
        - type: object
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/InstructorVehicle"
            stats:
              type: object
              properties:
                activeStudents:
                  type: integer
                totalAssessments:
                  type: integer
                completedAssessments:
                  type: integer
                totalFeedback:
                  type: integer
                avgOverall:
                  type: ["number", "null"]
                recommendRate:
                  type: ["integer", "null"]

    InstructorVehicleSummary:
      type: object
      required: [id, vehicleType, make, model]
      properties:
        id:
          type: integer
        vehicleType:
          type: string
          enum: [car, motorbike, mr_truck, hr_truck, hc_truck, mc_truck]
        make:
          type: string
        model:
          type: string
        year:
          type: ["integer", "null"]
        colour:
          type: ["string", "null"]
        rego:
          type: ["string", "null"]
        regoState:
          type: ["string", "null"]
        isDualControl:
          type: boolean

    InstructorVehicle:
      type: object
      required: [id, instructorId, vehicleType, make, model]
      properties:
        id:
          type: integer
        instructorId:
          type: integer
        vehicleType:
          type: string
          enum: [car, motorbike, mr_truck, hr_truck, hc_truck, mc_truck]
        make:
          type: string
        model:
          type: string
        year:
          type: ["integer", "null"]
        colour:
          type: ["string", "null"]
        rego:
          type: ["string", "null"]
        regoState:
          type: ["string", "null"]
        regoExpiry:
          type: ["string", "null"]
        isDualControl:
          type: boolean
        isOwnerOperator:
          type: boolean
        isPrimary:
          type: boolean
        insuranceProvider:
          type: ["string", "null"]
        insurancePolicyNumber:
          type: ["string", "null"]
        insuranceType:
          type: ["string", "null"]
        insuranceExpiry:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string

    InstructorVehicleInput:
      type: object
      required: [make, model]
      properties:
        vehicleType:
          type: string
          enum: [car, motorbike, mr_truck, hr_truck, hc_truck, mc_truck]
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        colour:
          type: string
        rego:
          type: string
        regoState:
          type: string
        regoExpiry:
          type: string
        isDualControl:
          type: boolean
        isOwnerOperator:
          type: boolean
        isPrimary:
          type: boolean
        insuranceProvider:
          type: string
        insurancePolicyNumber:
          type: string
        insuranceType:
          type: string
        insuranceExpiry:
          type: string
        status:
          type: string
          enum: [active, inactive]
        notes:
          type: string

    InstructorUpdate:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        vehicleMake:
          type: string
        vehicleModel:
          type: string
        vehicleYear:
          type: integer
        qualifications:
          type: string
        state:
          type: string
          description: "AU state/territory where this instructor primarily operates"

    # ─── Maneuvers ─────────────────────────────────────────────────────────────
    Maneuver:
      type: object
      required: [id, name, category, assessmentType, description]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        assessmentType:
          type: string
          enum: [tmr_learner, qsafe]
        description:
          type: string
        sortOrder:
          type: integer
        complianceCriteria:
          type: ["string", "null"]
        masteryDefinition:
          type: ["string", "null"]

    # ─── Assessments ───────────────────────────────────────────────────────────
    Assessment:
      type: object
      required: [id, studentId, instructorId, lessonDate, durationMinutes, status, pedalOperator, assessmentType]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        instructorId:
          type: integer
        studentName:
          type: ["string", "null"]
        instructorName:
          type: ["string", "null"]
        lessonDate:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        # Assessment program type — QSAFE (light vehicle), Q-Ride (motorcycle/e-bike), or Heavy Vehicle
        assessmentType:
          type: string
          enum: [qsafe, qride, heavy_vehicle]
          description: "Assessment program: qsafe (Driver Licensing Reg 2021, Ch.3), qride (Accreditation Reg 2015, s.33–41), heavy_vehicle (Driver Licensing Reg 2021, s.57–60)"
          default: qsafe
        # Safety-critical: who controls the pedals during this lesson
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
          description: "Who controls the pedals — student, instructor (dual control), or shared"
        confidenceNote:
          type: ["string", "null"]
        focusAreasNext:
          type: ["string", "null"]
        routePath:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng, ts]
            properties:
              lat:
                type: number
              lng:
                type: number
              ts:
                type: integer
        preLessonBriefingAcknowledgedAt:
          type: ["string", "null"]
        # Report finalization workflow
        finalizationStatus:
          type: string
          enum: [draft, pending_approval, approved, dispatched]
        approvedAt:
          type: ["string", "null"]
        approvedByUserId:
          type: ["integer", "null"]
        reportDispatchedAt:
          type: ["string", "null"]
        reportDispatchedTo:
          type: ["string", "null"]
          description: JSON array of email addresses the report was dispatched to
        createdAt:
          type: string

    ApproveAssessmentInput:
      type: object
      properties:
        dispatchEmails:
          type: array
          items:
            type: string
          description: Email addresses to record as dispatch recipients
        notes:
          type: string
          description: Optional approval notes

    AssessmentInput:
      type: object
      required: [studentId, lessonDate, durationMinutes, pedalOperator]
      properties:
        studentId:
          type: integer
        lessonDate:
          type: string
        durationMinutes:
          type: integer
        # Assessment program type (defaults to qsafe if omitted)
        assessmentType:
          type: string
          enum: [qsafe, qride, heavy_vehicle]
          default: qsafe
        # Required — instructor must explicitly confirm pedal control before saving
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
        confidenceNote:
          type: string
        focusAreasNext:
          type: string
        routePath:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng, ts]
            properties:
              lat:
                type: number
              lng:
                type: number
              ts:
                type: integer

    AssessmentUpdate:
      type: object
      properties:
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
        confidenceNote:
          type: string
        focusAreasNext:
          type: string
        status:
          type: string
          enum: [in_progress, completed]
        durationMinutes:
          type: integer
        routePath:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng, ts]
            properties:
              lat:
                type: number
              lng:
                type: number
              ts:
                type: integer
        acknowledgeBriefing:
          type: boolean
          description: "If true, records pre-lesson briefing acknowledged at now()"

    AssessmentDetail:
      type: object
      required: [id, studentId, instructorId, lessonDate, durationMinutes, status, pedalOperator, maneuverResults]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        instructorId:
          type: integer
        studentName:
          type: ["string", "null"]
        instructorName:
          type: ["string", "null"]
        lessonDate:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [in_progress, completed]
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
        confidenceNote:
          type: ["string", "null"]
        focusAreasNext:
          type: ["string", "null"]
        preLessonBriefingAcknowledgedAt:
          type: ["string", "null"]
        maneuverResults:
          type: array
          items:
            $ref: "#/components/schemas/ManeuverResult"
        createdAt:
          type: string

    ManeuverResult:
      type: object
      required: [id, assessmentId, maneuverId, competencyLevel]
      properties:
        id:
          type: integer
        assessmentId:
          type: integer
        maneuverId:
          type: integer
        maneuverName:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        competencyLevel:
          type: string
          enum: [not_attempted, attempted, practiced, mastered]
        notes:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lng:
          type: ["number", "null"]

    ManeuverResultsBatch:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ManeuverResultItem"

    ManeuverResultItem:
      type: object
      required: [maneuverId, competencyLevel]
      properties:
        maneuverId:
          type: integer
        competencyLevel:
          type: string
          enum: [not_attempted, attempted, practiced, mastered]
        notes:
          type: string
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true

    HeatmapPoint:
      type: object
      required: [lat, lng, maneuverId, maneuverName, competencyLevel]
      properties:
        lat:
          type: number
        lng:
          type: number
        maneuverId:
          type: integer
        maneuverName:
          type: string
        competencyLevel:
          type: string
          enum: [not_attempted, attempted, practiced, mastered]

    # ─── Handover ──────────────────────────────────────────────────────────────
    HandoverView:
      type: object
      required: [student, totalHours, completedManeuvers, totalManeuvers, notes, recentAssessments]
      properties:
        student:
          $ref: "#/components/schemas/Student"
        totalHours:
          type: number
        completedManeuvers:
          type: integer
        totalManeuvers:
          type: integer
        skillBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SkillBreakdownItem"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/HandoverNote"
        recentAssessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"

    HandoverNote:
      type: object
      required: [id, studentId, instructorId, note, isSafetyCritical, createdAt]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        instructorId:
          type: integer
        instructorName:
          type: ["string", "null"]
        note:
          type: string
        focusAreas:
          type: ["string", "null"]
        isSafetyCritical:
          type: boolean
          description: "If true, this note is displayed prominently on the pre-lesson briefing card"
        contentStatus:
          type: string
          enum: [approved, quarantined, under_review, released]
        createdAt:
          type: string

    HandoverNoteInput:
      type: object
      required: [note]
      properties:
        note:
          type: string
        focusAreas:
          type: string
        isSafetyCritical:
          type: boolean

    # ─── Intake ────────────────────────────────────────────────────────────────
    Intake:
      type: object
      required: [id, studentId]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        priorExperience:
          type: ["string", "null"]
        previousLessons:
          type: ["integer", "null"]
        previousInstructorFeedback:
          type: ["string", "null"]
        medicalConditions:
          type: ["string", "null"]
        learningGoals:
          type: ["string", "null"]
        preferredLessonTime:
          type: ["string", "null"]
        emergencyContact:
          type: ["string", "null"]
        emergencyPhone:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]

    IntakeInput:
      type: object
      properties:
        priorExperience:
          type: string
        previousLessons:
          type: integer
        previousInstructorFeedback:
          type: string
        medicalConditions:
          type: string
        learningGoals:
          type: string
        preferredLessonTime:
          type: string
        emergencyContact:
          type: string
        emergencyPhone:
          type: string

    # ─── Audit ─────────────────────────────────────────────────────────────────
    AuditLog:
      type: object
      required: [id, actorId, action, resourceType, createdAt]
      properties:
        id:
          type: integer
        actorId:
          type: integer
        actorName:
          type: ["string", "null"]
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: ["integer", "null"]
        studentId:
          type: ["integer", "null"]
        metadata:
          type: ["string", "null"]
        createdAt:
          type: string

    # ─── Dashboards ────────────────────────────────────────────────────────────
    InstructorDashboard:
      type: object
      required: [activeStudents, lessonsThisWeek, totalHoursLogged, recentAssessments, studentSummaries]
      properties:
        activeStudents:
          type: integer
        lessonsThisWeek:
          type: integer
        totalHoursLogged:
          type: number
        recentAssessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        studentSummaries:
          type: array
          items:
            $ref: "#/components/schemas/StudentSummary"

    StudentDashboard:
      type: object
      required: [totalHours, completedManeuvers, totalManeuvers, progressPercent, recentAssessments]
      properties:
        totalHours:
          type: number
        completedManeuvers:
          type: integer
        totalManeuvers:
          type: integer
        progressPercent:
          type: number
        nextFocusAreas:
          type: ["string", "null"]
        recentAssessments:
          type: array
          items:
            $ref: "#/components/schemas/Assessment"
        skillBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/SkillBreakdownItem"

    AdminDashboard:
      type: object
      required: [totalStudents, totalInstructors, totalAssessments, activeStudents, recentActivity]
