      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, denied]
                reviewNotes:
                  type: string
      responses:
        "200":
          description: Request reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingChangeRequest"
        "404":
          description: Not found
        "409":
          description: Not pending

  # ─── Notifications ────────────────────────────────────────────────────────────
  /notifications:
