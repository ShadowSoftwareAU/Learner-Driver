          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingItem"
    patch:
      operationId: updateBooking
      tags: [scheduling]
      summary: Update booking status or notes
      parameters:
        - in: path
