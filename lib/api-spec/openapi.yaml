        - in: query
          name: time
          required: true
          schema:
            type: string
        - in: query
          name: transmissionType
          schema:
            type: string
            enum: [auto, manual, either]
        - in: query
          name: suburb
          schema:
            type: string
        - in: query
          name: postcode
          schema:
            type: string
        - in: query
          name: durationMinutes
          schema:
            type: integer
      responses:
        "200":
          description: Available instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailableInstructor"

  /bookings/wizard-summary:
    get:
