      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documents]
              properties:
                documents:
                  type: array
                  items:
                    type: object
                    required: [docType, fileName, objectPath]
                    properties:
                      docType:
                        type: string
                      fileName:
                        type: string
                      fileSize:
                        type: integer
                      objectPath:
                        type: string
                      expiresAt:
                        type: string
                        description: "ISO date string (YYYY-MM-DD) when this document expires"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
