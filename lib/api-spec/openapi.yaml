      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, denied, withdrawn]
      responses:
        "200":
          description: List of change requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingChangeRequest"

  /bookings/{id}/change-requests:
    post:
      operationId: createBookingChangeRequest
      tags: [scheduling]
      summary: Submit a change request for a booking
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestType]
              properties:
                requestType:
                  type: string
                  enum: [cancel, reschedule, availability_override]
                requestedPayloadJson:
                  type: object
      responses:
        "201":
          description: Change request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingChangeRequest"
        "404":
