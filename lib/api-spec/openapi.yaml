      type: object
      required: [id, instructorId, dayOfWeek, startTime, endTime, transmissionTypes, isActive, contextType]
      properties:
        id:
          type: integer
        instructorId:
          type: integer
        dayOfWeek:
          type: integer
          description: "0=Sun, 1=Mon, ..., 6=Sat"
        startTime:
          type: string
          description: "HH:mm"
        endTime:
          type: string
          description: "HH:mm"
        transmissionTypes:
          type: string
          description: "CSV: auto, manual"
        isActive:
          type: boolean
        contextType:
          type: string
          enum: [independent, school]
          description: "Whether this slot belongs to the instructor's independent business or a linked school"
