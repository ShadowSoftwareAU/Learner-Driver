      summary: Approve, reject, or flag a single document within a verification application
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: docId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approved, rejected, needs_revision]
                notes:
                  type: string
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationDocument"

