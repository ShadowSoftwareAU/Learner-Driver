      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisedSessionInput"
      responses:
        "201":
          description: Supervised session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisedSession"
        "403":
          description: No active viewer link for this student

