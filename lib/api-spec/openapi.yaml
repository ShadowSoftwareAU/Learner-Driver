        "404":
          description: Session not found
    delete:
      operationId: deleteSupervisedSession
      tags: [viewer]
      summary: Delete a supervised session logged by this viewer
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                type: object
