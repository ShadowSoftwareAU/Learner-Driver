          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisedSessionInput"
      responses:
        "200":
          description: Updated supervised session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisedSession"
        "403":
