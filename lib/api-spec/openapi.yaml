      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [approved, rejected, needs_revision]
                notes:
                  type: string
      responses:
        "200":
          description: Updated verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorVerification"

