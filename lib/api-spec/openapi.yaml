    # ─── Assessments ───────────────────────────────────────────────────────────
    Assessment:
      type: object
      required: [id, studentId, instructorId, lessonDate, durationMinutes, status, pedalOperator, assessmentType]
      properties:
        id:
          type: integer
        studentId:
          type: integer
        instructorId:
          type: integer
        studentName:
          type: ["string", "null"]
        instructorName:
          type: ["string", "null"]
        lessonDate:
          type: string
        durationMinutes:
          type: integer
        status:
          type: string
          enum: [in_progress, completed, no_show]
        # Who performed the assessment
        performedByRole:
          type: string
          enum: [instructor, supervised]
          description: "'instructor' = licensed driving instructor (counts toward lesson plan); 'supervised' = parent/guardian/mentor (hours only, does not update lesson plan)"
          default: instructor
        # Assessment program type — QSAFE (light vehicle), Q-Ride (motorcycle/e-bike), or Heavy Vehicle
        assessmentType:
          type: string
          enum: [qsafe, qride, heavy_vehicle]
          description: "Assessment program: qsafe (Driver Licensing Reg 2021, Ch.3), qride (Accreditation Reg 2015, s.33–41), heavy_vehicle (Driver Licensing Reg 2021, s.57–60)"
          default: qsafe
        # Safety-critical: who controls the pedals during this lesson
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
          description: "Who controls the pedals — student, instructor (dual control), or shared"
        confidenceNote:
          type: ["string", "null"]
        focusAreasNext:
          type: ["string", "null"]
        routePath:
          type: array
          nullable: true
          items:
            type: object
            required: [lat, lng, ts]
            properties:
              lat:
                type: number
              lng:
                type: number
              ts:
                type: integer
        preLessonBriefingAcknowledgedAt:
          type: ["string", "null"]
        preDriveFitnessConfirmedAt:
          type: ["string", "null"]
          description: "Timestamp when the pre-drive fitness and sobriety check was confirmed"
        # Report finalization workflow
        finalizationStatus:
          type: string
          enum: [draft, pending_approval, approved, dispatched]
        approvedAt:
          type: ["string", "null"]
        approvedByUserId:
          type: ["integer", "null"]
        reportDispatchedAt:
          type: ["string", "null"]
        reportDispatchedTo:
          type: ["string", "null"]
          description: JSON array of email addresses the report was dispatched to
        # Lesson conditions recorded at session start
        weatherCondition:
          type: ["string", "null"]
          enum: [clear, partly_cloudy, overcast, light_rain, heavy_rain, foggy, windy]
          description: "Weather at lesson start"
        lightingCondition:
          type: ["string", "null"]
          enum: [daylight, dawn, dusk, night]
          description: "Lighting condition at lesson start"
        createdAt:
          type: string

