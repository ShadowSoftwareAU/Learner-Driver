        # Required — instructor must explicitly confirm pedal control before saving
        pedalOperator:
          type: string
          enum: [student, instructor, shared]
        confidenceNote:
          type: string
        focusAreasNext:
          type: string
        routePath:
          type: array
          nullable: true
          items:
