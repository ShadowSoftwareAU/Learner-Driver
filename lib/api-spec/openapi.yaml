          name: instructorId
          required: true
          schema:
            type: integer
        - in: query
          name: durationMinutes
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Wizard summary for the confirmation step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWizardSummary"

  /bookings:
    get:
      operationId: listBookings
