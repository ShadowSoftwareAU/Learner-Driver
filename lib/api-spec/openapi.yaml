openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Learner Log - Driving School Assessment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile and role management
  - name: students
    description: Student management
  - name: instructors
    description: Instructor management
  - name: assessments
    description: Lesson assessments
  - name: maneuvers
    description: Maneuver and competency definitions
  - name: handover
    description: Instructor handover notes
  - name: intake
    description: Student intake questionnaire
  - name: audit
    description: Audit trail
  - name: dashboard
    description: Dashboard summaries
  - name: scheduling
    description: Availability, zones, bookings and notifications
  - name: schools
    description: Driving school / tenant management
  - name: viewer
    description: Viewer role — parents, guardians, mentors
  - name: moderation
    description: Content moderation and safeguarding (super_admin only)
  - name: billing
    description: Subscriptions, feature entitlements, and Stripe skeleton
  - name: demo
    description: Demo mode controls (super_admin only)
  - name: wallet
    description: Guardian/parent prepaid credit wallet — Stripe top-ups and booking payments
  - name: toilets
    description: Community cleanliness ratings for public toilets (OSM-sourced)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update own display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfile"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/role:
    patch:
      operationId: updateMyRole
      tags: [users]
      summary: Set or update user role (admin only in prod; open for onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  # ─── Students ────────────────────────────────────────────────────────────────
  /students/parse-licence:
    post:
      tags: [Students]
      summary: OCR-parse a driver licence image
      operationId: parseLicence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [frontBase64]
              properties:
                frontBase64:
                  type: string
                  description: "Base64-encoded front image"
                frontMimeType:
                  type: string
                  default: image/jpeg
                backBase64:
                  type: string
                  description: "Base64-encoded rear image (optional)"
                backMimeType:
                  type: string
      responses:
        "200":
          description: Extracted licence data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedLicenceData"
        "400":
          description: Bad request
        "422":
          description: Could not parse OCR response

  /students/me:
    get:
      operationId: getMyStudentProfile
      tags: [students]
      summary: Get the authenticated student's own profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Profile not found
    patch:
      operationId: updateMyStudentProfile
      tags: [students]
      summary: Update the authenticated student's own profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnStudentProfile"
      responses:
        "200":
          description: Updated student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students (instructor sees own; admin sees all)
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"

    post:
      operationId: createStudent
      tags: [students]
      summary: Create student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get student by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found

    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update student profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentUpdate"
      responses:
        "200":
          description: Updated student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"

  /students/{id}/progress:
    get:
      operationId: getStudentProgress
      tags: [students]
      summary: Get student skill progress summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"

  /students/{id}/lesson-plan:
    get:
      operationId: getStudentLessonPlan
      tags: [students]
      summary: Generate a dynamic lesson plan based on student skill gaps
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lesson plan with prioritised focus areas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonPlan"

  /students/{id}/medical:
    get:
      operationId: getStudentMedical
      tags: [students]
      summary: Get decrypted medical/allergy info (instructor/admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decrypted medical data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentMedical"
        "403":
          description: Forbidden

    patch:
      operationId: updateStudentMedical
      tags: [students]
      summary: Update encrypted medical/allergy info for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentMedicalInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentMedical"

  /students/{id}/viewer-code:
    post:
      operationId: generateViewerCode
      tags: [students]
      summary: Generate (or regenerate) a viewer link code for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Viewer code issued
          content:
            application/json:
              schema:
                type: object
                required: [viewerCode, viewerCodeIssuedAt]
                properties:
                  viewerCode:
                    type: string
                  viewerCodeIssuedAt:
                    type: string

  /students/{id}/milestones:
    get:
      operationId: getStudentMilestones
      tags: [students]
      summary: Get milestone badges earned by a student (and locked ones)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of all milestone definitions with earned status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentMilestone"

  /students/{id}/maneuver-stats:
    get:
      operationId: getStudentManeuverStats
      tags: [students]
      summary: Per-maneuver attempt counts and best competency level for a student
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Maneuver stats sorted by attempt count descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManeuverStat"

  # ─── Instructors ─────────────────────────────────────────────────────────────
  /instructors:
    get:
      operationId: listInstructors
      tags: [instructors]
      summary: List all instructors (admin only)
      parameters:
        - name: trainingCategory
          in: query
          schema: { type: string }
          description: Filter by training category
      responses:
        "200":
          description: List of instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instructor"

  /instructors/{id}:
    get:
      operationId: getInstructor
      tags: [instructors]
      summary: Get instructor profile with vehicles and stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Instructor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorDetail"

    patch:
      operationId: updateInstructor
      tags: [instructors]
      summary: Update instructor profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorUpdate"
      responses:
        "200":
          description: Updated instructor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

  /instructors/{id}/vehicles:
    get:
      operationId: listInstructorVehicles
      tags: [instructors]
      summary: List vehicles registered to this instructor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstructorVehicle"
    post:
      operationId: addInstructorVehicle
      tags: [instructors]
      summary: Register a new vehicle for this instructor
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorVehicleInput"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorVehicle"
        "400": { description: Validation error }
        "403": { description: Access denied }

  /instructors/{id}/vehicles/{vehicleId}:
    patch:
      operationId: updateInstructorVehicle
      tags: [instructors]
      summary: Update a vehicle record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorVehicleInput"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorVehicle"
    delete:
      operationId: deleteInstructorVehicle
      tags: [instructors]
      summary: Remove a vehicle record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: vehicleId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /instructors/{id}/training-categories:
    patch:
      operationId: updateInstructorTrainingCategories
      tags: [instructors]
      summary: Set the training categories this instructor is qualified to teach
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trainingCategories]
              properties:
                trainingCategories:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Updated categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  trainingCategories:
                    type: array
                    items: { type: string }

  /instructors/{id}/verifications:
    get:
      operationId: listInstructorVerifications
      tags: [instructors]
      summary: List verification applications for a specific instructor (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Verification applications with documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminVerification"

  # ─── Maneuvers / Competencies ─────────────────────────────────────────────────
  /maneuvers:
    get:
      operationId: listManeuvers
      tags: [maneuvers]
      summary: List all maneuver/competency definitions (TMR + QSAFE)
      responses:
        "200":
          description: Maneuver list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Maneuver"

  # ─── Assessments ──────────────────────────────────────────────────────────────
  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List assessments (filtered by studentId or instructorId)
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: instructorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Assessment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"

    post:
      operationId: createAssessment
      tags: [assessments]
      summary: Log a new lesson assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentInput"
      responses:
        "201":
          description: Created assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get a single assessment with maneuver results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentDetail"
        "404":
          description: Not found

    patch:
      operationId: updateAssessment
      tags: [assessments]
      summary: Update assessment notes or status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentUpdate"
      responses:
        "200":
          description: Updated assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}/submit:
    post:
      operationId: submitAssessment
      tags: [assessments]
      summary: Submit a completed assessment for instructor approval (draft → pending_approval)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        "404":
          description: Not found
        "409":
          description: Assessment already submitted or approved

  /assessments/{id}/approve:
    post:
      operationId: approveAssessment
      tags: [assessments]
      summary: Approve an assessment and record report dispatch details (pending_approval → approved)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveAssessmentInput"
      responses:
        "200":
          description: Assessment approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"
        "404":
          description: Not found
        "409":
          description: Assessment not in pending_approval state

  /assessments/{id}/results:
    post:
      operationId: saveManeuverResults
      tags: [assessments]
      summary: Save maneuver competency ratings for an assessment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManeuverResultsBatch"
      responses:
        "200":
          description: Saved results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManeuverResult"

  /assessments/heatmap:
    get:
      operationId: getManeuverHeatmap
      tags: [assessments]
      summary: Get maneuver location data for heatmap visualization
      parameters:
        - name: maneuverId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Heatmap data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapPoint"

  # ─── Handover ─────────────────────────────────────────────────────────────────
  /handover/{studentId}:
    get:
      operationId: getHandover
      tags: [handover]
      summary: Get handover view for a student (completed hours, skills, notes)
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Handover summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverView"

  /handover/{studentId}/notes:
    post:
      operationId: addHandoverNote
      tags: [handover]
      summary: Add a handover note for a student
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HandoverNoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoverNote"

  # ─── Intake ───────────────────────────────────────────────────────────────────
  /intake/{studentId}:
    get:
      operationId: getIntake
      tags: [intake]
      summary: Get student intake questionnaire responses
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Intake data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intake"
        "404":
          description: Not found

    put:
      operationId: saveIntake
      tags: [intake]
      summary: Submit or update intake questionnaire
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeInput"
      responses:
        "200":
          description: Saved intake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intake"

  # ─── Audit Trail ──────────────────────────────────────────────────────────────
  /audit:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries (admin only)
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Audit log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── Dashboard ────────────────────────────────────────────────────────────────
  /dashboard/instructor:
    get:
      operationId: getInstructorDashboard
      tags: [dashboard]
      summary: Instructor dashboard — student counts, recent lessons, upcoming
      responses:
        "200":
          description: Instructor dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorDashboard"

  /dashboard/student:
    get:
      operationId: getStudentDashboard
      tags: [dashboard]
      summary: Student dashboard — hours, skill completion, recent assessments
      responses:
        "200":
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard — fleet overview, instructor stats, compliance
      responses:
        "200":
          description: Admin dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  # ─── Instructor own profile ───────────────────────────────────────────────────
  /instructor/profile:
    get:
      operationId: getInstructorProfile
      tags: [instructors]
      summary: Get the authenticated instructor's own profile
      responses:
        "200":
          description: Instructor profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"

  # ─── Availability ─────────────────────────────────────────────────────────────
  /availability/my-contexts:
    get:
      operationId: getMyAvailabilityContexts
      tags: [scheduling]
      summary: Get the contexts available to the authenticated instructor when creating or editing availability slots
      description: "Returns 'independent' if the instructor is independent, plus one entry per actively-linked school admin in school_instructor_links"
      responses:
        "200":
          description: List of available contexts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilityContext"

  /availability/me:
    get:
      operationId: getMyAvailability
      tags: [scheduling]
      summary: Get my availability slots
      responses:
        "200":
          description: List of availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /availability:
    post:
      operationId: createAvailabilitySlot
      tags: [scheduling]
      summary: Create availability slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAvailabilitySlot"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySlot"

  /availability/instructor/{instructorId}/calendar:
    get:
      operationId: getInstructorCalendar
      tags: [scheduling]
      summary: Get an instructor's availability calendar with booked slots for a date range
      parameters:
        - in: path
          name: instructorId
          required: true
          schema:
            type: integer
        - in: query
          name: from
          required: true
          schema:
            type: string
          description: "Start date YYYY-MM-DD"
        - in: query
          name: to
          required: true
          schema:
            type: string
          description: "End date YYYY-MM-DD"
      responses:
        "200":
          description: Calendar data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorCalendar"

  /availability/{id}:
    patch:
      operationId: updateAvailabilitySlot
      tags: [scheduling]
